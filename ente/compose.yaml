services:
  ts-ente:
    container_name: ts-ente
    image: tailscale/tailscale:latest
    hostname: ente
    environment:
      - TS_AUTH_ONCE=1
      - TS_CLIENT_ID=${TS_CLIENT_ID}
      - TS_CLIENT_SECRET=${TS_CLIENT_SECRET}
      - TS_EXTRA_ARGS=--advertise-tags=tag:containers
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-ente.json
    volumes:
      - ts-ente:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./ts-config:/config
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  museum:
    image: ghcr.io/ente/server
    depends_on:
      ts-ente:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - 8080:8080 # API
    environment:
      - ENTE_DB_USER=${POSTGRES_USER}
      - ENTE_DB_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - ENTE_KEY_ENCRYPTION=${ENTE_KEY_ENCRYPTION}
      - ENTE_KEY_HASH=${ENTE_KEY_HASH}
      - ENTE_JWT_SECRET=${ENTE_JWT_SECRET}
    volumes:
      - ./museum.yaml:/museum.yaml:ro
      - ${HOME}/containers_storage/ente/data:/data:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Resolve "localhost:3200" in the museum container to the minio container.
  socat:
    image: alpine/socat
    network_mode: service:museum
    depends_on: [museum]
    command: "TCP-LISTEN:3200,fork,reuseaddr TCP:minio:3200"

  web:
    image: ghcr.io/ente/web
    depends_on:
      ts-ente:
        condition: service_started
      museum:
        condition: service_started
    ports:
      - 3000:3000 # Photos web app
      # - 3001:3001 # Accounts
      - 3002:3002 # Public albums
      - 3003:3003 # Auth
      # - 3004:3004 # Cast
      # - 3005:3005 # Share
      # - 3006:3006 # Embed
      # - 3008:3008 # Paste
      # - 3009:3009 # Locker
      # - 3010:3010 # Memories
    # Set this to your custom museum URL, if any.
    environment:
      ENTE_API_ORIGIN: http://localhost:8080

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ente_db
    healthcheck:
      test: pg_isready -q -d ente_db -U ${POSTGRES_USER}
      start_period: 40s
      start_interval: 1s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: pgsty/silo
    ports:
      - 3200:3200 # MinIO API
      # Uncomment to enable the MinIO web UI.
      # - 3201:3201
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":3200" --console-address ":3201"
    volumes:
      - minio-data:/data
    post_start:
      - command: |
          sh -c '
          while ! mc alias set h0 http://minio:3200 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} 2>/dev/null
          do
            echo "Waiting for minio..."
            sleep 0.5
          done

          cd /data

          mc mb -p b2-eu-cen
          mc mb -p wasabi-eu-central-2-v3
          mc mb -p scw-eu-fr-v3
          '

volumes:
  ts-ente:
    driver: local
  postgres-data:
  minio-data:
