services:
  ts-sharkord:
    container_name: ts-sharkord
    image: tailscale/tailscale:latest
    hostname: msg
    environment:
      - TS_AUTH_ONCE=1
      - TS_CLIENT_ID=${TS_CLIENT_ID}
      - TS_CLIENT_SECRET=${TS_CLIENT_SECRET}
      - TS_EXTRA_ARGS=--advertise-tags=tag:containers
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-sharkord.json
    volumes:
      - ts-sharkord:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./ts-config:/config
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  sharkord:
    image: sharkord/sharkord:latest
    container_name: sharkord
    restart: unless-stopped
    network_mode: service:ts-sharkord
    depends_on:
      ts-sharkord:
        condition: service_started
    environment:
      SHARKORD_PORT: "4991"
      # the address clients send voice and video to
      # SHARKORD_WEBRTC_ANNOUNCED_ADDRESS: "your-domain.com"
    volumes:
      - ${HOME}/containers_storage/sharkord/data:/home/bun/.config/sharkord

volumes:
  ts-sharkord:
    driver: local
